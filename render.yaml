services:
  - type: web
    name: dwellagent-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_URL
        value: https://dwellagenttest-backend-gd5x.onrender.com
      - key: ATLAS_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: VITE_GOOGLE_PLACES_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:5178,https://dwell-agent-vercel.vercel.app,https://dwelledge.github.io,https://dwelledge.github.io/DwellAgentTest
